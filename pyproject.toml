[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "english-telegram-tutor"
version = "0.1.0"
description = "A voice-enabled English practice partner for Telegram"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29", "lameenc>=1.8,<2", "numpy>=2,<3", "python-telegram-bot>=22,<23", "python-dotenv>=1,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
speech = ["piper-tts==1.8.0"]

[project.scripts]
english-bot = "english_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
